<div id="intro" hidden><div class="in-wrap"><img src="icon-512.png" alt="" width="112" height="112"><b>UR TURN</b><span id="intro-t"></span><i></i></div></div>
<script>(function(){try{var sa=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
var el=document.getElementById("intro");if(!sa||sessionStorage.getItem("urturn.intro")){el.remove();return;}

var done=function(){if(!el.parentNode)return;el.classList.add("out");setTimeout(function(){el.remove();},650);};
setTimeout(done,3600);var t0=Date.now();el.addEventListener("pointerdown",function(){if(Date.now()-t0>1500)done();});}catch(e){var x=document.getElementById("intro");if(x)x.remove();}})();</script>
