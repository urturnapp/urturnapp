<body>
<div id="intro" hidden><div class="in-wrap"><img src="icon-512.png" alt="" width="112" height="112"><b>UR TURN</b><span id="intro-t"></span><i></i></div></div>
<script>(function(){try{var sa=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
var el=document.getElementById("intro");if(!sa||sessionStorage.getItem("urturn.intro")){el.remove();return;}
sessionStorage.setItem("urturn.intro","1");var en=localStorage.getItem("urturn.lang")==="en";
document.getElementById("intro-t").textContent=en?"Your turn comes to you":"دورك بيوصلك لحالك";el.hidden=false;
var done=function(){if(!el.parentNode)return;el.classList.add("out");setTimeout(function(){el.remove();},450);};
setTimeout(done,1100);el.addEventListener("pointerdown",done);}catch(e){var x=document.getElementById("intro");if(x)x.remove();}})();</script>
<header class="top" id="topbar" hidden>
  <div class="wrap">
    <a class="logo" href="./"><img src="icon.svg" width="32" height="32" alt="">UR TURN</a>
    <nav class="tabs" id="tabs"></nav>
    <div class="tools"><button class="btn lang" id="langBtn" type="button">English</button></div>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>
